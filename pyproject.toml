[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kxvo"
version = "0.1.0"
description = "Camera-only monocular visual odometry with floor-anchored scale for small indoor drones"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "pymavlink>=2.4.40"]

[project.optional-dependencies]
test = ["pytest>=8"]
xfeat = ["torch>=2.2", "tqdm>=4"]
plots = ["matplotlib>=3.8"]
benchmark = ["poselib>=2.0"]
sitl = ["empy==3.3.4", "pexpect", "future"]

[project.scripts]
kxvo = "kxvo.cli:main"
kxbench = "kxvo.scenario:main"

[tool.setuptools]
packages = ["kxvo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
